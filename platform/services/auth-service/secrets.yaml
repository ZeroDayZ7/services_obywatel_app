service: "auth_service"
socket_path: "/var/run/agent-sockets/agent.sock"
timeout: 5s

credentials:
  - name: "postgres"
    type: "postgres"
    rotation_interval: 45m
    enabled: true

  - name: "redis"
    type: "redis"
    rotation_interval: 1h
    enabled: false

  - name: "rabbitmq"
    type: "amqp"
    rotation_interval: 30m
    enabled: false