version: "2"

sql:
  - schema: "db/migrations"
    queries: "db/queries"
    engine: "postgresql"

    gen:
      go:
        package: "dbgen"
        out: "db/dbgen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true

        overrides:
          # UUID
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          # UUID (dla NULLable) -> jeśli chcesz czyste UUID, ustaw pointer: false
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: false
          
          - db_type: "integer"
            go_type: "int"

          # citizens
          - column: "citizens.created_at"
            go_type: "time.Time"

          - column: "citizens.updated_at"
            go_type: "time.Time"

          - column: "citizens.email_hash"
            go_type: "string"

          - column: "citizens.phone_hash"
            go_type: "string"

          # citizen_audit_logs
          - column: "citizen_audit_logs.created_at"
            go_type: "time.Time"
            
          - column: "citizen_audit_logs.ip_address"
            go_type: "string"

          - column: "citizen_audit_logs.payload_hash"
            go_type: "string"

          # user_agreements
          - column: "user_agreements.signed_at"
            go_type: "time.Time"

          - column: "user_agreements.verified_at"
            go_type:
              type: "time.Time"
              pointer: true

          - column: "user_agreements.created_at"
            go_type: "time.Time"

          - column: "user_agreements.updated_at"
            go_type: "time.Time"

          - column: "user_agreements.deleted_at"
            go_type:
              type: "time.Time"
              pointer: true

          # user_puk_codes
          - column: "user_puk_codes.expires_at"
            go_type:
              type: "time.Time"
              pointer: true

          - column: "user_puk_codes.used_at"
            go_type:
              type: "time.Time"
              pointer: true

          - column: "user_puk_codes.created_at"
            go_type: "time.Time"

          - column: "user_puk_codes.updated_at"
            go_type: "time.Time"

          - column: "user_puk_codes.deleted_at"
            go_type:
              type: "time.Time"
              pointer: true

          # outbox_messages
          - column: "outbox_messages.processed_at"
            go_type:
              type: "time.Time"
              pointer: true

          - column: "outbox_messages.created_at"
            go_type: "time.Time"

          - column: "outbox_messages.updated_at"
            go_type: "time.Time"

          - column: "outbox_messages.deleted_at"
            go_type:
              type: "time.Time"
              pointer: true

          # nullable text
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true

          # nullable varchar
          - db_type: "varchar"
            nullable: true
            go_type:
              type: "string"
              pointer: true