x-common-settings: &common-settings
  restart: ${DOCKER_RESTART_POLICY:-no}
  environment:
    - ENV=${APP_ENV:-development}
  networks:
    - citizen-app-net

services:
  # region GATEWAY
  # --- GATEWAY ---
  # gateway:
  #   <<: *common-settings
  #   image: golang:1.26.2-alpine3.23
  #   container_name: app-gateway
  #   working_dir: /app
  #   volumes:
  #     - ../services/gateway:/app
  #     - ../platform:/platform
  #     - go-modules:/go/pkg
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     db-auth:
  #       condition: service_healthy
  #     cache-redis:
  #       condition: service_started

  # region db-auth
  # --- AUTHENTICATION DATABASE ---
  db-auth:
    <<: *common-settings
    image: postgres:18.3-alpine
    container_name: db-auth
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_database}
      POSTGRES_PASSWORD_FILE: /run/secrets/auth_db_pass
    secrets:
      - auth_db_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # region db-notification
  # --- NOTIFICATION DATABASE ---
  db-notification:
    <<: *common-settings
    image: postgres:18.3-alpine
    container_name: db-notification
    environment:
      POSTGRES_USER: ${NOTIFY_DB_USER:-notification_user}
      POSTGRES_DB: ${NOTIFY_DB_NAME:-notification_database}
      POSTGRES_PASSWORD_FILE: /run/secrets/notify_db_pass
    secrets:
      - notify_db_pass
    ports:
      - "5434:5432"
    volumes:
      - pg_notification_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # region db-citizen-docs
  # # --- CITIZEN DOCUMENTS DATABASE ---
  db-citizen-docs:
    <<: *common-settings
    image: postgres:18.3-alpine
    container_name: db-citizen-docs
    environment:
      POSTGRES_USER: ${CITIZEN_DB_USER:-citizen_user}
      POSTGRES_DB: ${CITIZEN_DB_NAME:-citizen_docs_database}
      POSTGRES_PASSWORD_FILE: /run/secrets/citizen_db_pass
    secrets:
      - citizen_db_pass
    ports:
      - "5433:5432"
    volumes:
      - pg_citizen_docs_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # region db-audit
  # --- AUDIT DATABASE ---
  db-audit:
    <<: *common-settings
    image: postgres:18.3-alpine
    container_name: db-audit
    environment:
      POSTGRES_USER: ${AUDIT_DB_USER:-audit_user}
      POSTGRES_DB: ${AUDIT_DB_NAME:-audit_database}
      POSTGRES_PASSWORD_FILE: /run/secrets/audit_db_pass
    secrets:
      - audit_db_pass
    ports:
      - "5435:5432"
    volumes:
      - pg_audit_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # region db-messaging
  # --- MESSAGING DATABASE ---
  db-messaging:
    <<: *common-settings
    image: postgres:18.3-alpine
    container_name: db-messaging
    environment:
      POSTGRES_USER: ${MESSAGING_DB_USER:-messaging_user}
      POSTGRES_DB: ${MESSAGING_DB_NAME:-messaging_database}
      POSTGRES_PASSWORD_FILE: /run/secrets/messaging_db_pass
    secrets:
      - messaging_db_pass
    ports:
      - "5436:5432"
    volumes:
      - pg_messaging_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # region cache-redis
  # --- SESSION & CACHING ---
  cache-redis:
    <<: *common-settings
    image: redis:8.6-alpine
    container_name: cache-redis
    secrets:
      - redis_auth_pass
    command: >
      sh -c 'redis-server --requirepass $$(cat /run/secrets/redis_auth_pass)'
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

    # region rabbitmq
  rabbitmq:
    <<: *common-settings
    image: rabbitmq:4.3.1-management
    container_name: rabbitmq_server
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "password"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

