  # region secrets
secrets:
  auth_db_pass:
    file: ./secrets/.auth_db_password
  citizen_db_pass:
    file: ./secrets/.citizen_db_password
  notify_db_pass:
    file: ./secrets/.notify_db_password
  audit_db_pass:
    file: ./secrets/.audit_db_password
  redis_auth_pass:
    file: ./secrets/.redis_password
  pgadmin_root_pass:
    file: ./secrets/.pgadmin_admin_password
  messaging_db_pass:
    file: ./secrets/.messaging_db_password

  # region volumes
volumes:
  pg_auth_data:
  pg_citizen_docs_data:
  pg_notification_data:
  pg_audit_data:
  pg_messaging_data:
  redis_data:
  go-modules:
  rabbitmq_data:

  # region networks
networks:
  citizen-app-net:
    name: obywatel_app__network
    driver: bridge
