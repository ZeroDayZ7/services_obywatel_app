  # region secrets
secrets:
  auth_db_root_pass:
    file: ./secrets/.auth_db_password # HeadAdmin
  kms_admin_pass:
    file: ./secrets/.kms_admin_auth_pass # Admin for KMS
  citizen_db_pass:
    file: ./secrets/.citizen_db_password
  notify_db_pass:
    file: ./secrets/.notify_db_password
  audit_db_pass:
    file: ./secrets/.audit_db_password
  redis_auth_pass:
    file: ./secrets/.redis_password
  pgadmin_root_pass:
    file: ./secrets/.pgadmin_admin_password
  messaging_db_pass:
    file: ./secrets/.messaging_db_password
  identity_db_pass:
    file: ./secrets/.identity_db_password

  minio_root_user:
    file: ./secrets/.minio_user
  minio_root_pass:
    file: ./secrets/.minio_password
  rabbitmq_root_user:
    file: ./secrets/.rabbitmq_user
  rabbitmq_root_pass:
    file: ./secrets/.rabbitmq_password

  # region volumes
volumes:
  pg_test_data:
  pg_auth_data:
  pg_citizen_docs_data:
  pg_notification_data:
  pg_audit_data:
  pg_messaging_data:
  pg_identity_data:
  redis_data:
  go-modules:
  rabbitmq_data:
  minio_data:
  socket-data:
    external: true
    name: secret_agent_sockets
  go-build-cache:
  go-mod-cache:

  # region networks
networks:
  gateway-net:
    name: app_gateway_net
    driver: bridge
  auth-db-net:
    name: app_auth_db_net
    driver: bridge
    internal: false
  identity-db-net:
    name: app_identity_db_net
    driver: bridge
    internal: false
  cache-net:
    name: app_cache_net
    driver: bridge
    internal: false
  target-admin-net:
    name: kms_target-admin-net
    external: true
  sec-net:
    name: kms_sec-net
    external: true

  citizen-app-net:
    name: obywatel_app__network
    driver: bridge
