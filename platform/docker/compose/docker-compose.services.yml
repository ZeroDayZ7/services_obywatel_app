name: obywatel-app

#region Common Settings
x-common-settings: &common-settings
  restart: ${DOCKER_RESTART_POLICY:-no}
  env_file:
    - ../.env
  environment:
    - ENV=${APP_ENV:-development}
  networks:
    - citizen-app-net
#endregion

services:
  #region API Gateway
  gateway:
    <<: *common-settings
    image: golang:1.26.2-alpine3.23
    container_name: app-gateway
    working_dir: /app
    volumes:
      - ../../services/gateway:/app
      - ../../platform:/platform
      - go-modules:/go/pkg
    ports:
      - "8080:8080"
    depends_on:
      db-auth:
        condition: service_healthy
      cache-redis:
        condition: service_started
  #endregion

#region Volumes
volumes:
  go-modules:
#endregion

#region Networks
networks:
  citizen-app-net:
    name: obywatel_app__network
    driver: bridge
#endregion
