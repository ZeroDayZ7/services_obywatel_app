name: obywatel-app

#region Common Settings
x-common-settings: &common-settings
  restart: ${DOCKER_RESTART_POLICY:-no}
  env_file:
    - ../.env
  environment:
    - ENV=${APP_ENV:-development}
  networks:
    - citizen-app-net
#endregion

services:
  #region Database: Auth
  db-auth:
    <<: *common-settings
    image: postgres:18.3-alpine
    container_name: db-auth
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_database}
      POSTGRES_PASSWORD_FILE: /run/secrets/auth_db_pass
    secrets:
      - auth_db_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  #endregion

  #region Database: Notification
  db-notification:
    <<: *common-settings
    image: postgres:18.3-alpine
    container_name: db-notification
    environment:
      POSTGRES_USER: ${NOTIFY_DB_USER:-notification_user}
      POSTGRES_DB: ${NOTIFY_DB_NAME:-notification_database}
      POSTGRES_PASSWORD_FILE: /run/secrets/notify_db_pass
    secrets:
      - notify_db_pass
    ports:
      - "5434:5432"
    volumes:
      - pg_notification_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  #endregion

  #region Database: Citizen Docs
  db-citizen-docs:
    <<: *common-settings
    image: postgres:18.3-alpine
    container_name: db-citizen-docs
    environment:
      POSTGRES_USER: ${CITIZEN_DB_USER:-citizen_user}
      POSTGRES_DB: ${CITIZEN_DB_NAME:-citizen_docs_database}
      POSTGRES_PASSWORD_FILE: /run/secrets/citizen_db_pass
    secrets:
      - citizen_db_pass
    ports:
      - "5433:5432"
    volumes:
      - pg_citizen_docs_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  #endregion

  #region Database: Audit
  db-audit:
    <<: *common-settings
    image: postgres:18.3-alpine
    container_name: db-audit
    environment:
      POSTGRES_USER: ${AUDIT_DB_USER:-admin}
      POSTGRES_DB: ${AUDIT_DB_NAME:-audit-database}
      POSTGRES_PASSWORD_FILE: /run/secrets/audit_db_pass
    secrets:
      - audit_db_pass
    ports:
      - "5435:5432"
    volumes:
      - pg_audit_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  #endregion

  #region Database: Messaging
  db-messaging:
    <<: *common-settings
    image: postgres:18.3-alpine
    container_name: db-messaging
    environment:
      POSTGRES_USER: ${MESSAGING_DB_USER:-messaging_user}
      POSTGRES_DB: ${MESSAGING_DB_NAME:-messaging_db}
      POSTGRES_PASSWORD_FILE: /run/secrets/messaging_db_pass
    secrets:
      - messaging_db_pass
    ports:
      - "5436:5432"
    volumes:
      - pg_messaging_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  #endregion

  # region Database: Identity
  # --- IDENTITY DATABASE ---
  db-identity:
    <<: *common-settings
    image: postgres:18.3-alpine
    container_name: db-identity
    environment:
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity_user}
      POSTGRES_DB: ${IDENTITY_DB_NAME:-identity_database}
      POSTGRES_PASSWORD_FILE: /run/secrets/identity_db_pass
    secrets:
      - identity_db_pass
    ports:
      - "5437:5432"
    volumes:
      - pg_identity_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  #endregion


#region Secrets
secrets:
  auth_db_pass:
    file: ../secrets/.auth_db_password
  citizen_db_pass:
    file: ../secrets/.citizen_db_password
  notify_db_pass:
    file: ../secrets/.notify_db_password
  audit_db_pass:
    file: ../secrets/.audit_db_password
  messaging_db_pass:
    file: ../secrets/.messaging_db_password
  identity_db_pass:
    file: ./secrets/.identity_db_password
#endregion

#region Volumes
volumes:
  pg_auth_data:
  pg_citizen_docs_data:
  pg_notification_data:
  pg_messaging_data:
  pg_audit_data:
  pg_identity_data:
#endregion

#region Networks
networks:
  citizen-app-net:
    name: obywatel_app__network
    driver: bridge
#endregion