name: Staging - Gateway GitOps

on:
  push:
    branches: [staging]
    paths:
      - "platform/services/gateway/**"
      - ".github/workflows/staging-gateway.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ vars.GHCR_OWNER }}
      IMAGE_NAME: ${{ vars.GHCR_IMAGE_GATEWAY }}

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare Metadata
        id: vars
        run: |
          echo "--- LOG: Starting metadata preparation ---"
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT

          # Debugging logów
          echo "Repository: ${{ github.repository }}"
          echo "Owner from vars: $OWNER"
          echo "Image Name from vars: $IMAGE_NAME"
          echo "SHA: $SHA_SHORT"
          echo "--- LOG: Metadata prepared successfully ---"

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: 🏗️ Build & Push Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./platform/services/gateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Update Infra Repo (GitOps)
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          SHA: ${{ steps.vars.outputs.sha_short }}
        run: |
          echo "--- LOG: Starting GitOps Update ---"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git clone https://$INFRA_TOKEN@github.com/${{ github.repository_owner }}/k3s-obywatel-plus-gitops.git temp_infra
          cd temp_infra/overlays/staging/services/gateway

          TARGET_FILE="kustomization.yaml"

          echo "Updating image tag in $TARGET_FILE..."
          kustomize edit set image ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:$SHA

          # Sprawdzenie co się zmieniło (debug)
          cat $TARGET_FILE

          if git diff --quiet; then
            echo "⚠️ No changes detected."
          else
            echo "--- LOG: Committing changes ---"
            git add $TARGET_FILE
            git commit -m "feat(gateway): update staging image to $SHA"
            git push origin main
            echo "✅ Successfully pushed to infra repo."
          fi

          echo "--- LOG: GitOps Update Finished ---"
