name: Staging - Gateway GitOps

on:
  push:
    branches: [staging]
    paths:
      - "platform/services/gateway/**"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./platform/services/gateway
          file: ./platform/services/gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner_lc }}/obywatel-gateway:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Infra Repo (GitOps)
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          SHA: ${{ steps.vars.outputs.sha_short }}
          OWNER: ${{ steps.vars.outputs.owner_lc }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git clone https://$INFRA_TOKEN@github.com/${{ github.repository_owner }}/k3s-obywatel-plus-gitops.git temp_infra
          cd temp_infra

          # Tutaj upewnij się, że w repo infra ścieżka do pliku jest poprawna
          # Poprzednio pisałeś o base/services/gateway/deployment.yaml
          sed -i "s|image: ghcr.io/.*/obywatel-gateway:.*|image: ghcr.io/$OWNER/obywatel-gateway:$SHA|g" base/services/gateway/deployment.yaml

          git add .
          git commit -m "feat(gateway): deploy staging version $SHA" || echo "No changes"
          git push origin main
