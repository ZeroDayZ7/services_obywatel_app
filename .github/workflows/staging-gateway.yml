name: Staging - Gateway GitOps

on:
  push:
    branches: [staging]
    paths:
      - "platform/services/gateway/**"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/obywatel-gateway
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=staging
          flavor: |
            lower=true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./platform/services/gateway
          file: ./platform/services/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Infra Repo (GitOps)
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          OWNER: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          SHA: ${{ steps.meta.outputs.version }}
        run: |
          # Wyciągamy samą nazwę użytkownika (małe litery) z pełnego tagu
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="obywatel-gateway"

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # Klonowanie repozytorium infra
          git clone https://$INFRA_TOKEN@github.com/${{ github.repository_owner }}/k3s-obywatel-plus-gitops.git temp_infra
          cd temp_infra

          # Precyzyjna zamiana obrazu w manifeście
          # Używamy wygenerowanego SHA (short) i wymuszonego lowercase ownera
          sed -i "s|image: ghcr.io/.*/$IMAGE_NAME:.*|image: ghcr.io/$OWNER_LC/$IMAGE_NAME:$SHA|g" base/services/gateway/deployment.yaml

          git add .
          git commit -m "feat(gateway): deploy version $SHA" || echo "No changes to commit"
          git push origin main
