name: Staging - Deploy Gateway

on:
  push:
    branches:
      - main
      - staging
    # Workflow odpali się TYLKO, gdy zmienisz coś w folderze gateway
    # lub w samym workflow. Oszczędza to czas i koszty CI/CD.
    paths:
      - "gateway/**"
      - ".github/workflows/staging-gateway.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logowanie do Twojego Registry (np. GitHub Container Registry lub DockerHub)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Budowanie i wypchnięcie obrazu
      - name: Build and Push Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          # Tagujemy obraz nazwą serwisu, środowiskiem i krótkim SHA commita
          tags: |
            ghcr.io/${{ github.repository }}/gateway:staging
            ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-k3s:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Tutaj łączymy się z Twoim klastrem K3s
      # Wymaga dodania KUBE_CONFIG_STAGING do GitHub Secrets
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      # Aktualizacja obrazu w klastrze (ArgoCD style lub direct kubectl)
      - name: Deploy to K3s
        run: |
          kubectl set image deployment/gateway-deployment gateway=ghcr.io/${{ github.repository }}/gateway:${{ github.sha }} -n staging
